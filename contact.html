<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | ACCREVIA Neurotech</title>

<meta name="description"
content="Contact ACCREVIA Neurotech for mechanistic preclinical validation of implantable neurotechnology devices.">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<nav class="navbar">

<a href="index.html" class="logo">
ACCREVIA
</a>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="index.html#services">Services</a></li>
<li><a href="index.html#technology">Technology</a></li>
<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

</header>


<section class="contact-section">

<div class="contact-wrapper">

<div class="contact-header">

<h1>
Partner With Us
</h1>

<p>
Discuss your implantable neurotechnology validation needs.
</p>

</div>

<form
class="contact-form"
action="https://formspree.io/f/mnjerbww"
method="POST">

<div class="form-row">

<div class="form-group">

<label>Name</label>

<input
type="text"
name="name"
required>

</div>

<div class="form-group">

<label>Company</label>

<input
type="text"
name="company">

</div>

</div>


<div class="form-row">

<div class="form-group">

<label>Email</label>

<input
type="email"
name="email"
required>

</div>

<div class="form-group">

<label>Technology Area</label>

<select name="technology">

<option>Brain–Computer Interface</option>

<option>Peripheral Nerve Interface</option>

<option>Deep Brain Stimulation</option>

<option>Bioelectronic Medicine</option>

<option>Neural Prosthetics</option>

<option>Other</option>

</select>

</div>

</div>


<div class="form-group">

<label>Project Description</label>

<textarea
name="message"
rows="8"
placeholder="Describe your device, validation challenge, and development stage."
required></textarea>

</div>


<button
type="submit"
class="btn-primary">

Submit Inquiry

</button>

</form>

</div>

</section>


<footer>

<div class="footer-container">

<p>
© 2026 ACCREVIA Neurotech. Mechanistic validation for next-generation neurotechnology.
</p>

</div>

</footer>

</body>

</html>
