<section class="contact-section">


<div class="contact-container">


<h1>
Partner with us
</h1>


<p>
Discuss your implantable neurotechnology validation needs.
</p>



<form 
action="https://formspree.io/f/mnjerbww"
method="POST">


<label>
Name
</label>

<input 
type="text"
name="name"
required>



<label>
Company
</label>

<input 
type="text"
name="company">



<label>
Email
</label>

<input
type="email"
name="email"
required>



<label>
Technology Area
</label>


<select name="technology">

<option>
Brain-computer interface
</option>

<option>
Peripheral nerve interface
</option>

<option>
Deep brain stimulation
</option>

<option>
Bioelectronic medicine
</option>

<option>
Other
</option>

</select>



<label>
Project Description
</label>


<textarea
name="message"
rows="6"
placeholder="Describe your device, validation challenge, and development stage."
required>
</textarea>



<button type="submit">
Submit Inquiry
</button>


</form>
